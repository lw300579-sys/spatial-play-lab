<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#F7F0D8"/>
  <rect x="40" y="40" width="720" height="420" stroke="#18181B" stroke-width="3" fill="#FFFDF7"/>
  <!-- court cam -->
  <rect x="100" y="100" width="380" height="260" fill="#22C55E" fill-opacity="0.25" stroke="#18181B" stroke-width="2.5"/>
  <line x1="290" y1="100" x2="290" y2="360" stroke="#18181B" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- skeleton overlay -->
  <circle cx="200" cy="160" r="16" stroke="#E15A46" stroke-width="2.5" fill="none"/>
  <line x1="200" y1="176" x2="200" y2="240" stroke="#E15A46" stroke-width="2.5"/>
  <line x1="200" y1="200" x2="250" y2="175" stroke="#E15A46" stroke-width="2.5"/>
  <line x1="250" y1="175" x2="290" y2="150" stroke="#E15A46" stroke-width="2.5"/>
  <!-- angle callout -->
  <path d="M250 175 Q270 160 290 150" stroke="#1E3A8A" stroke-width="2" fill="none"/>
  <rect x="520" y="120" width="200" height="220" fill="#18181B" stroke="#18181B" stroke-width="2.5"/>
  <text x="540" y="160" font-family="ui-monospace,monospace" font-size="13" fill="#EAB308">ELBOW 142°</text>
  <text x="540" y="190" font-family="ui-monospace,monospace" font-size="13" fill="#22C55E">HIP-SH 28°</text>
  <text x="540" y="220" font-family="ui-monospace,monospace" font-size="13" fill="#E15A46">SWING ²</text>
  <text x="540" y="260" font-family="ui-monospace,monospace" font-size="12" fill="#FFFDF7" opacity="0.7">KALMAN LOCK</text>
  <text x="60" y="470" font-family="ui-monospace,monospace" font-size="14" fill="#18181B" opacity="0.6">33-LANDMARK · YOLO · COURT CAM</text>
</svg>
